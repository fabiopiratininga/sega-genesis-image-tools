name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sgit.exe
            archive_name: sgit-windows-x86_64.zip
            use_upx: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sgit
            archive_name: sgit-linux-x86_64.tar.gz
            use_upx: true

          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: sgit
            archive_name: sgit-macos-arm64.tar.gz
            use_upx: false

          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: sgit
            archive_name: sgit-macos-x86_64.tar.gz
            use_upx: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install UPX (Linux)
        if: matrix.use_upx && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Install UPX (Windows)
        if: matrix.use_upx && runner.os == 'Windows'
        run: choco install upx --no-progress

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compress binary with UPX
        if: matrix.use_upx
        shell: bash
        run: |
          upx --best target/${{ matrix.target }}/release/${{ matrix.bin_name }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }}, README.md, LICENSE -DestinationPath ${{ matrix.archive_name }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }} -C ../../../ README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz